services:
  # Producción: docker compose up -d --build  → http://localhost:8080
  web:
    build:
      context: .
      target: prod
    image: eceaas-web:latest
    container_name: eceaas-web
    ports:
      - "${WEB_PORT:-8080}:80"
    restart: unless-stopped

  # Desarrollo: docker compose --profile dev up dev  → http://localhost:5173
  dev:
    profiles: ["dev"]
    build:
      context: .
      target: dev
    container_name: eceaas-dev
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
