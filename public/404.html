<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>ECEAAS</title>
    <!-- SPA redirect for static hosting (GitHub Pages / Netlify fallback) -->
    <script>
      // Preserve the path and redirect to /#/path so the SPA router can handle it.
      // This is needed when using createWebHistory() on hosts that don't support
      // server-side fallback to index.html.
      const path = window.location.pathname
      if (path !== '/') {
        window.location.replace('/' + '?redirect=' + encodeURIComponent(path))
      }
    </script>
  </head>
  <body></body>
</html>
